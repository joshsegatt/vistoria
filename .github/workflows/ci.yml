name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test -c Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item src/Vistoria/bin/Release/net472/Vistoria.exe dist/
          $hash = (Get-FileHash dist/Vistoria.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Vistoria.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v6
        with:
          name: Vistoria
          path: dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/Vistoria.exe dist/SHA256SUMS.txt --title "Vistoria ${{ github.ref_name }}" --generate-notes --prerelease
